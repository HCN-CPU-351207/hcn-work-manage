name: Build HCN (Android .apk)

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npm test
      # Giao diện bản Android
      - run: npm run build:android
      # Tạo dự án Android, icon, rồi vá cấu hình (http trong Wi-Fi, phiên bản, ký APK)
      - run: npx cap add android
      - run: npx @capacitor/assets generate --android --iconBackgroundColor "#121614" --iconBackgroundColorDark "#121614" --splashBackgroundColor "#121614" --splashBackgroundColorDark "#121614"
      - run: node scripts/android-prepare.mjs
      - run: npx cap sync android
      # Dùng keystore riêng nếu đã khai báo trong Settings > Secrets (khuyến nghị khi phát hành rộng)
      - name: Keystore từ Secrets (nếu có)
        env:
          KS_B64: ${{ secrets.HCN_KEYSTORE_BASE64 }}
        if: env.KS_B64 != ''
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/hcn.jks"
          echo "HCN_KEYSTORE=$RUNNER_TEMP/hcn.jks" >> "$GITHUB_ENV"
      - name: Build APK
        working-directory: android
        env:
          HCN_KEYSTORE_PASSWORD: ${{ secrets.HCN_KEYSTORE_PASSWORD }}
          HCN_KEY_ALIAS: ${{ secrets.HCN_KEY_ALIAS }}
          HCN_KEY_PASSWORD: ${{ secrets.HCN_KEY_PASSWORD }}
        run: |
          if [ -z "$HCN_KEYSTORE_PASSWORD" ]; then unset HCN_KEYSTORE_PASSWORD HCN_KEY_ALIAS HCN_KEY_PASSWORD; fi
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Đặt tên file
        run: |
          VER=$(node -p "require('./package.json').version")
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/HCN-${VER}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: HCN-Android
          path: out/*.apk
      - name: Lấy số phiên bản
        id: ver
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
        shell: bash
      - name: Đính kèm vào GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # build từ main: đăng vào Release theo số phiên bản (vd. v1.0.0) để ai cũng tải được, không cần đăng nhập
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.ver.outputs.v) }}
          name: HCN Work Manage ${{ steps.ver.outputs.v }}
          make_latest: true
          body: |
            Tải file cài ở mục Assets bên dưới:
            - Máy tính Windows: HCN-Setup-${{ steps.ver.outputs.v }}.exe
            - Điện thoại Android: HCN-${{ steps.ver.outputs.v }}.apk
          files: out/*.apk
