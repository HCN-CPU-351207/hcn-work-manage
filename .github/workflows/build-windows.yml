name: Build HCN (Windows .exe)

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - name: Gắn mã dự án Google (từ GitHub Secrets)
        env:
          HCN_GOOGLE_DESKTOP_ID: ${{ secrets.HCN_GOOGLE_DESKTOP_ID }}
          HCN_GOOGLE_DESKTOP_SECRET: ${{ secrets.HCN_GOOGLE_DESKTOP_SECRET }}
          HCN_GOOGLE_ANDROID_ID: ${{ secrets.HCN_GOOGLE_ANDROID_ID }}
        run: node scripts/inject-google.mjs
      - run: npm run typecheck
        continue-on-error: true
      # Tạo file cài đặt trong thư mục release/
      - name: npm run dist
        shell: bash
        run: |
          set -o pipefail
          npm run dist 2>&1 | tee dist.log || { grep -iE "error|warning|!insert|macro|invalid|abort|⨯|line [0-9]+" dist.log | grep -v "Command line defined" | head -9 | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: HCN-Setup
          path: |
            release/HCN-Setup-*.exe
            release/HCN-Setup-*.exe.blockmap
            release/latest.yml
      # Khi đẩy tag (ví dụ v1.0.0): đính kèm vào GitHub Release để electron-updater tải được
      - name: Lấy số phiên bản
        id: ver
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
        shell: bash
      - name: Publish release assets
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # build từ main: đăng vào Release theo số phiên bản (vd. v1.0.0) để ai cũng tải được, không cần đăng nhập
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.ver.outputs.v) }}
          name: HCN Work Manage ${{ steps.ver.outputs.v }}
          make_latest: true
          body: |
            Tải file cài ở mục Assets bên dưới:
            - Máy tính Windows: HCN-Setup-${{ steps.ver.outputs.v }}.exe
            - Điện thoại Android: HCN-${{ steps.ver.outputs.v }}.apk
          files: |
            release/HCN-Setup-*.exe
            release/HCN-Setup-*.exe.blockmap
            release/latest.yml
